<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>2D Hayatta Kalma</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Dikey Ekran Uyarısı -->
  <div id="rotate-warning">
    <div class="rotate-box">
      <div class="rotate-icon">📱 ➔ 🔄</div>
      <h3>Lütfen Telefonu Yan Çevirin</h3>
      <p>En iyi deneyim için yatay ekran gereklidir.</p>
    </div>
  </div>

  <!-- Giriş Menüsü -->
  <div id="device-modal">
    <div class="modal-box">
      <h2>2D Hayatta Kalma</h2>
      <div class="version-tag">v1.3.0 (Mobil Sadeleştirme)</div>
      <p>Oyun Modunu Seç:</p>
      <div class="modal-buttons">
        <button id="btn-pc" class="choice-btn">💻 Bilgisayar (Klavye)</button>
        <button id="btn-mobile" class="choice-btn">📱 Mobil (Dokunmatik)</button>
      </div>
    </div>
  </div>

  <!-- Ana Oyun Alanı -->
  <div id="game-container" class="hidden">
    <!-- Sağ Üst Panel: Tam Ekran & Tek Alet Değiştirme Tuşu -->
    <div id="top-right-controls">
      <button id="btn-tool-cycle" class="hud-btn" title="Aleti Değiştir">⚔️ Kılıç</button>
      <button id="btn-fullscreen" class="hud-btn" title="Tam Ekran">⛶</button>
    </div>

    <!-- Üst Skor / Durum Barı -->
    <div id="ui-bar">
      <div class="stat-box">❤️ <span id="health-val">100</span></div>
      <div class="stat-box">📅 <span id="day-val">1. Gün</span></div>
      <div class="stat-box">⏳ <span id="time-val">Gündüz (0:30)</span></div>
      <div class="stat-box">🌲 <span id="wood-val">0</span></div>
      <div class="stat-box">🪨 <span id="stone-val">0</span></div>
    </div>

    <!-- Mini Harita -->
    <canvas id="minimapCanvas" width="110" height="82"></canvas>

    <!-- Oyun Tuvali -->
    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <!-- Bilgisayar Kontrol İpucu -->
    <div id="pc-controls" class="hint-text">
      <b>W,A,S,D:</b> Hareket | <b>Space/Tık:</b> Vur/Topla | <b>Q veya 1,2,3:</b> Alet Değiştir | <b>B:</b> Üs (10O, 5T)
    </div>

    <!-- Mobil Arayüz Katmanı -->
    <div id="mobile-overlay" class="hidden">
      <!-- Sol Alt: Dokunmatik Joystick -->
      <div id="joystick-zone">
        <div id="joystick-base">
          <div id="joystick-knob"></div>
        </div>
      </div>

      <!-- Sağ Alt: Sadece 2 Tane Ferah Buton -->
      <div id="action-zone">
        <button id="btn-build" class="touch-action-btn build-btn">🏠</button>
        <button id="btn-attack" class="touch-action-btn attack-btn">⚔️</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>

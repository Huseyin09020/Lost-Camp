<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2D Hayatta Kalma</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cihaz Seçim Ekranı -->
  <div id="device-modal">
    <div class="modal-box">
      <h2>Oyun Modunu Seç</h2>
      <p>Nasıl oynamak istiyorsun?</p>
      <div class="modal-buttons">
        <button id="btn-pc" class="choice-btn">💻 Bilgisayar (Klavye)</button>
        <button id="btn-mobile" class="choice-btn">📱 Mobil (Joystick)</button>
      </div>
    </div>
  </div>

  <!-- Ana Oyun Alanı -->
  <div id="game-container" class="hidden">
    <!-- Üst Arayüz -->
    <div id="ui-bar">
      <div class="stat-box">❤️ Can: <span id="health-val">100</span></div>
      <div class="stat-box">⏳ Durum: <span id="time-val">Gündüz</span></div>
      <div class="stat-box">🌲 Odun: <span id="wood-val">0</span></div>
      <div class="stat-box">🪨 Taş: <span id="stone-val">0</span></div>
    </div>

    <!-- Oyun Tuvali -->
    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <!-- Bilgisayar Kontrol İpucu -->
    <div id="pc-controls" class="hint-text">
      Hareket: <b>W,A,S,D</b> | Saldır: <b>BOŞLUK / Tık</b> | Üs Kur: <b>B</b> (10 Odun, 5 Taş)
    </div>

    <!-- Mobil Arayüz Katmanı (Joystick + Aksiyon Butonları) -->
    <div id="mobile-overlay" class="hidden">
      <!-- Sol Alt: Dokunmatik Joystick Alanı -->
      <div id="joystick-zone">
        <div id="joystick-base">
          <div id="joystick-knob"></div>
        </div>
      </div>

      <!-- Sağ Alt: Aksiyon Butonları -->
      <div id="action-zone">
        <button id="btn-attack" class="touch-action-btn attack-btn">⚔️</button>
        <button id="btn-build" class="touch-action-btn build-btn">🏠</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
